name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - 'CITATION.cff'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - 'CITATION.cff'

# Supersede in-flight runs for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GitHub's default shell for `run:` is `bash -e` — WITHOUT pipefail, so any
# piped command reports only the exit status of the last stage. Naming bash
# explicitly gets `bash --noprofile --norc -eo pipefail`, which is the only
# reason a failing `cargo test | tee` is visible below.
defaults:
  run:
    shell: bash

jobs:
  # The worker e2e and the smoke test both need ./target/debug/ods
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Keeps compiled dependencies between runs; keyed on the toolchain and Cargo.lock
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install DuckDB
        run: |
          curl -sSL https://github.com/duckdb/duckdb/releases/download/v1.4.1/duckdb_cli-linux-amd64.zip -o duckdb.zip
          sudo unzip -d /usr/local/bin duckdb.zip duckdb
          rm duckdb.zip
          duckdb --version

      # 24 is in the runner image's tool cache, so this downloads nothing
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            worker/package-lock.json
            site/package-lock.json

      # 1.26 is in the runner image's tool cache; the conformance runner needs 1.24+.
      # No go.sum in this repo, so setup-go's module cache has nothing to key on.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false

      - name: Cache OCI Conformance Runner
        id: conformance-cache
        uses: actions/cache@v6
        with:
          path: ~/go/bin/conformance
          # change me if you change the go version or the OCI conformance commit
          key: conformance-${{ runner.os }}-3ecd27b5c78d-go1.26

      - name: Install OCI Conformance Runner
        if: steps.conformance-cache.outputs.cache-hit != 'true'
        run: go install github.com/opencontainers/distribution-spec/conformance@3ecd27b5c78d

      # Build, tests, smoke test and worker checks: the steps `scripts/ci.sh` runs locally.
      # Each step's log is a collapsible group, and the timings land in the job summary.
      - name: Run CI steps
        run: scripts/ci.sh

name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - 'CITATION.cff'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - 'CITATION.cff'

# Supersede in-flight runs for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GitHub's default shell for `run:` is `bash -e` — WITHOUT pipefail, so any
# piped command reports only the exit status of the last stage. Naming bash
# explicitly gets `bash --noprofile --norc -eo pipefail`, which is the only
# reason a failing `cargo test | tee` is visible below.
defaults:
  run:
    shell: bash

jobs:
  # The worker e2e and the smoke test both need ./target/debug/ods
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run ods tests
        run: cargo test

      # Surfaced rather than enforced: a count that drops is the signal worth
      # noticing, and it catches deleted, ignored and neutered tests alike.
      # grep, not rg — ripgrep is not installed on GitHub's runners.
      - name: Test count
        run: |
          COUNT=$(cargo test -- --list 2>/dev/null | grep -c ': test$')
          echo "$COUNT tests" >> "$GITHUB_STEP_SUMMARY"

      # Release-mode compile coverage without a second full build. cargo check
      # runs the frontend and stops before codegen and linking; cargo test above
      # already links a debug binary. What neither catches is release-only
      # runtime behaviour (debug_assert! compiled out, overflow checks off) —
      # that needs `cargo test --release`, which is not worth it per-PR.
      - name: Check release profile compiles
        run: cargo check --release

      - name: Build binary
        run: cargo build

      - name: Test ods make oci and audit verification
        run: |
          TMP_ZIP=$(mktemp -d)/hscorgrefdataxml_data_7.0.0_20260731000001.zip
          zip -j -q "$TMP_ZIP" tests/fixtures/mock_hscorgrefdata.xml
          ./target/debug/ods make --input "$TMP_ZIP" --output ods_data/releases/2026-07-31
          ./target/debug/ods make oci --input ods_data/releases/2026-07-31 --version 0.1.0 --check
          ./target/debug/ods audit --input "$TMP_ZIP" --workspace ods_data --full

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Install OCI Conformance Runner
        run: go install github.com/opencontainers/distribution-spec/conformance@3ecd27b5c78d

      - name: Install Worker Dependencies
        run: npm ci --prefix worker

      - name: Run ods.fyi worker tests
        run: npm test --prefix worker

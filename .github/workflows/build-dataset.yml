name: Build dataset

# Builds and verifies and attsets our dataset releases.
#
# - archive: Be kind to NHS bandwidth. Cache archives we fetch in ghcr.io/olizilla/nhs-ods-xml
# - witness (macos): Ensure `ods make` gives reproducible outout across different architectures.
# - primary (ubuntu): Builds the release. Checks output hash matches the one created by witness.
#   Pushes the parquet image to ghcr.io/olizilla/ods-data
# - candidate: propose and update to releases.json. PR it to announce the new release.

on:
  workflow_dispatch:
    inputs:
      dates:
        description: "latest, all, or space-separated YYYY-MM-DD dates"
        required: true
        default: latest
      repository:
        description: The dataset package to build for
        required: true
        type: choice
        default: ods-data-rehearsal
        options:
          - ods-data-rehearsal
          - ods-data

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

defaults:
  run:
    shell: bash

jobs:
  archive:
    name: Ensure every date's archive image exists
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      # The tool version this run is tagged with, for the dataset's versioned tag
      version: ${{ steps.tag.outputs.version }}
    permissions:
      contents: read
      packages: write
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the tag, and read the tool version
        id: tag
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" || "${GITHUB_REF_NAME:-}" != "v$version" ]]; then
            echo "✖ this workflow only runs from the tag v$version (Cargo.toml's version), workflow_dispatch only" >&2
            echo "  it ran from ${GITHUB_REF_TYPE:-<unset>} '${GITHUB_REF_NAME:-<unset>}'" >&2
            exit 1
          fi
          echo "✓ running from tag v$version"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - &install_rust_toolchain
        name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version

      - &cache_rust_build
        name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: build-dataset-${{ runner.os }}

      - &cargo_build
        name: Build and install ods
        run: |
          cargo install --locked --path .
          ods --version

      - &install_oras
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1

      - &login_to_ghcr
        name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Query TRUD's listing
        env:
          TRUD_API_KEY: ${{ secrets.TRUD_API_KEY }}
        run: ods trud list --all --format json >listing.json

      - name: Resolve the dates to build
        env:
          DATES_INPUT: ${{ inputs.dates }}
        run: |
          if [[ "$DATES_INPUT" == "latest" ]]; then
            jq -r '.[0].date' listing.json >dates.txt
          elif [[ "$DATES_INPUT" == "all" ]]; then
            oras repo tags ghcr.io/olizilla/nhs-ods-xml | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | sort >dates.txt
          else
            tr ' ' '\n' <<<"$DATES_INPUT" >dates.txt
          fi
          echo "* building: $(tr '\n' ' ' <dates.txt)"

      - name: Find archives to fetch from TRUD
        run: |
          # `oras repo tags` decides which dates already exist; a failing call is a failure,
          # never read as "none of them exist".
          existing_tags="$(oras repo tags ghcr.io/olizilla/nhs-ods-xml)" || {
            echo "✖ listing tags for ghcr.io/olizilla/nhs-ods-xml failed" >&2
            exit 1
          }

          : >to_fetch.txt
          mapfile -t dates <dates.txt
          for date in "${dates[@]}"; do
            if grep -qx "$date" <<<"$existing_tags"; then
              echo "✓ $date  already in ghcr.io/olizilla/nhs-ods-xml"
            else
              echo "* $date  not cached yet: fetch it from TRUD"
              echo "$date" >>to_fetch.txt
            fi
          done

      - name: Fetch and cache archives from TRUD
        env:
          TRUD_API_KEY: ${{ secrets.TRUD_API_KEY }}
        run: |
          mapfile -t to_fetch <to_fetch.txt
          for date in "${to_fetch[@]}"; do
            echo "::group::$date"
            ods trud pull "$date" -w "$RUNNER_TEMP/ws"
            scripts/verify-trud-bundle.sh "$RUNNER_TEMP/ws/releases/$date/trud"
            ods make oci --source -i "$RUNNER_TEMP/ws/releases/$date"
            scripts/push-source-bundles.sh -w "$RUNNER_TEMP/ws" --push
            digest="$(jq -r '.manifests[0].digest' "$RUNNER_TEMP/ws/releases/$date/trud/oci/index.json")"

            # Check the tags. Fetch the image back, re-verify the files match.
            resolved="$(oras resolve "ghcr.io/olizilla/nhs-ods-xml:$date")"
            if [[ "$resolved" != "$digest" ]]; then
              echo "✖ ghcr.io/olizilla/nhs-ods-xml:$date resolves to $resolved, not the digest just packed $digest" >&2
              exit 1
            fi
            rm -rf "$RUNNER_TEMP/archive-reverify"
            oras pull "ghcr.io/olizilla/nhs-ods-xml@$digest" -o "$RUNNER_TEMP/archive-reverify" >/dev/null
            scripts/verify-trud-bundle.sh "$RUNNER_TEMP/archive-reverify"
            echo "✓ $date  pushed and re-verified  $digest"
            echo "::endgroup::"
          done

      - name: List each date's archive image
        id: plan
        run: |
          # Every date to build, with its archive image's digest, read from the registry now that
          # any missing archive has been fetched. A date with no image stops the run here.
          : >plan.jsonl
          mapfile -t dates <dates.txt
          for date in "${dates[@]}"; do
            digest="$(oras resolve "ghcr.io/olizilla/nhs-ods-xml:$date")" || {
              echo "✖ $date  has no archive image in ghcr.io/olizilla/nhs-ods-xml" >&2
              exit 1
            }
            echo "✓ $date  ghcr.io/olizilla/nhs-ods-xml@$digest"
            jq -n --arg d "$date" --arg dig "$digest" '{date: $d, bundle_digest: $dig}' >>plan.jsonl
          done
          echo "matrix=$(jq -s -c '.' plan.jsonl)" >>"$GITHUB_OUTPUT"

  witness:
    name: Witness every date (macos-latest)
    needs: archive
    runs-on: macos-latest
    permissions:
      contents: read
      packages: read
    outputs:
      digests: ${{ steps.build.outputs.digests }}
    steps:
      - *checkout
      - *install_rust_toolchain
      - *cache_rust_build
      - *cargo_build
      - *install_oras
      - *login_to_ghcr

      - name: Install gnupg (gpgv)
        run: brew install gnupg

      - name: Build every date
        id: build
        env:
          TRUD_API_KEY: ${{ secrets.TRUD_API_KEY }}
          MATRIX: ${{ needs.archive.outputs.matrix }}
        run: |
          : >digests.json.tmp
          mapfile -t rows < <(jq -c '.[]' <<<"$MATRIX")
          for row in "${rows[@]}"; do
            date="$(jq -r '.date' <<<"$row")"
            bundle_digest="$(jq -r '.bundle_digest' <<<"$row")"

            scripts/ci-build-date.sh "$date" "$bundle_digest" "release/$date" | tee build.log
            digest="$(tail -n1 build.log)"
            echo "✓ $date  built  $digest"

            jq -n --arg d "$date" --arg dig "$digest" '{($d): $dig}' >>digests.json.tmp
          done

          digests="$(jq -s -c 'add // {}' digests.json.tmp)"
          echo "digests=$digests" >>"$GITHUB_OUTPUT"

  primary:
    name: Primary ${{ matrix.date }} (ubuntu-latest)
    needs: [archive, witness]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(needs.archive.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - *checkout
      - *install_rust_toolchain
      - *cache_rust_build
      - *cargo_build
      - *install_oras
      - *login_to_ghcr

      - name: Pull, verify and build ${{ matrix.date }}
        env:
          TRUD_API_KEY: ${{ secrets.TRUD_API_KEY }}
          DATE: ${{ matrix.date }}
          BUNDLE_DIGEST: ${{ matrix.bundle_digest }}
        run: |
          scripts/ci-build-date.sh "$DATE" "$BUNDLE_DIGEST" "release/$DATE" | tee build.log
          tail -n1 build.log >digest.txt

      - name: Compare with the witness
        env:
          DATE: ${{ matrix.date }}
          WITNESS_DIGEST: ${{ fromJSON(needs.witness.outputs.digests)[matrix.date] }}
        run: |
          primary_digest="$(cat digest.txt)"
          if [[ "$primary_digest" != "$WITNESS_DIGEST" ]]; then
            echo "✖ $DATE  ubuntu-latest and macos-latest disagree" >&2
            echo "  ubuntu-latest (primary)  $primary_digest" >&2
            echo "  macos-latest (witness)   $WITNESS_DIGEST" >&2
            exit 1
          fi
          echo "✓ $DATE  ubuntu-latest and macos-latest agree: $primary_digest"

      - name: Push
        id: push
        env:
          REPOSITORY: ${{ inputs.repository }}
          VERSION: ${{ needs.archive.outputs.version }}
          DATE: ${{ matrix.date }}
        run: |
          gated_digest="$(cat digest.txt)"
          scripts/ci-push-dataset.sh "$REPOSITORY" "$VERSION" "$DATE" "$gated_digest" "release/$DATE/oci" pushed-digest.txt
          echo "digest=$(cat pushed-digest.txt)" >>"$GITHUB_OUTPUT"

      - name: Record
        env:
          REPOSITORY: ${{ inputs.repository }}
          DATE: ${{ matrix.date }}
        run: |
          jq --arg a "https://ods.fyi/v2/$REPOSITORY" --arg b "https://ghcr.io/v2/olizilla/$REPOSITORY" \
            '.mirrors = [{url: $a}, {url: $b}]' \
            data/releases.json >candidate-full.json
          ods make release --input "release/$DATE" --index candidate-full.json
          jq --arg d "$DATE" '[.releases[] | select(.trud_release_date == $d)][0]' candidate-full.json >"candidate-$DATE.json"

      - name: Re-verify with ods pull
        env:
          REPOSITORY: ${{ inputs.repository }}
          DATE: ${{ matrix.date }}
        run: |
          # Reads ghcr.io only — the copy just pushed, not whichever mirror answers first.
          jq --arg g "https://ghcr.io/v2/olizilla/$REPOSITORY" '.mirrors = [{url: $g}]' \
            candidate-full.json >candidate-ghcr-only.json

          rm -rf "$RUNNER_TEMP/reverify"
          mkdir -p "$RUNNER_TEMP/reverify"
          cp candidate-ghcr-only.json "$RUNNER_TEMP/reverify/candidate-ghcr-only.json"
          (cd "$RUNNER_TEMP/reverify" && ods pull "$DATE" --index candidate-ghcr-only.json)

      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/olizilla/${{ inputs.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: candidate-${{ matrix.date }}
          path: candidate-${{ matrix.date }}.json
          if-no-files-found: error

  candidate:
    name: Merge the candidate index
    needs: [archive, primary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: candidate-*
          path: rows
          merge-multiple: true

      - name: Merge every date's row
        run: |
          rows_json="$(jq -s '.' rows/*.json)"
          dup="$(jq -r '[.[].trud_release_date] | group_by(.) | map(select(length > 1)) | flatten | unique | .[]' <<<"$rows_json")"
          if [[ -n "$dup" ]]; then
            echo "✖ more than one primary recorded the same date:" >&2
            while IFS= read -r date; do echo "  $date" >&2; done <<<"$dup"
            exit 1
          fi
          jq --argjson rows "$rows_json" '
            ($rows | map(.trud_release_date)) as $recorded_dates
            | .releases = ([.releases[] | select(.trud_release_date as $d | ($recorded_dates | index($d)) == null)] + $rows
                           | sort_by(.trud_release_date) | reverse)
          ' data/releases.json >"$RUNNER_TEMP/candidate.json"

      - name: Write the job summary
        env:
          MATRIX: ${{ needs.archive.outputs.matrix }}
        run: |
          {
            echo "### Candidate"
            echo "| date | manifest |"
            echo "| :--- | :--- |"
          } >>"$GITHUB_STEP_SUMMARY"

          mapfile -t dates < <(jq -r '.[].date' <<<"$MATRIX")
          for date in "${dates[@]}"; do
            digest="$(jq -r --arg d "$date" '[.releases[] | select(.trud_release_date == $d) | .datasets[]][0].manifest_digest' "$RUNNER_TEMP/candidate.json")"
            echo "| $date | \`$digest\` |" >>"$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate.json
          if-no-files-found: error

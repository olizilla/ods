[package]
name = "ods"
# The tool version. The one place it is set. Bumping it needs a '## [x.y.z]' entry in CHANGELOG.md.
version = "0.2.3"
edition = "2021"
description = "Fetch, query, cite and reproduce NHS ODS data as verifiable Parquet"
license = "MIT"
homepage = "https://ods.fyi"
repository = "https://github.com/olizilla/ods"
readme = "README.md"
keywords = ["nhs", "org", "open-data", "oci", "parquet"]
categories = ["command-line-utilities", "science"]
exclude = ["worker"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
quick-xml = { version = "0.31", features = ["serialize"] }
arrow = { version = "60", default-features = false }
parquet = { version = "60", features = ["arrow"] }
walkdir = "2.4"
zip = { version = "1.0", default-features = false, features = ["deflate"] }
rayon = "1.12"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.23"
ureq = { version = "2.9", features = ["json"] }
crossterm = "0.29"
comfy-table = { version = "8.0", features = ["custom_styling"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.9"
jsonschema = { version = "0.58", default-features = false }

[profile.dev]
# Full DWARF debug info takes target/ from 2.3G to 3.5G (measured): every test binary statically
# links the whole dependency graph, with debug info duplicated in each one. That's what filled
# the CI runner's disk. A panic's file:line comes from #[track_caller], not DWARF, so assertion
# failures are unaffected; only a RUST_BACKTRACE stack trace loses line numbers.
debug = false

[profile.release]
opt-level = 3

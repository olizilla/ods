[package]
name = "ods"
version = "0.1.0"
edition = "2021"
description = "NHS ODS Semantic Compiler"

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.31", features = ["serialize"] }
arrow = { version = "53", default-features = false }
parquet = { version = "53", features = ["arrow"] }
walkdir = "2.4"
zip = "1.0"
rayon = "1.12"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
criterion = "0.5"
tempfile = "3.9"
zip = "1.0"

[[bench]]
name = "compile_bench"
harness = false

[profile.release]
opt-level = 3

[package]
name = "ods"
version = "0.1.0"
edition = "2021"
description = "Fetch, query, cite and reproduce NHS ODS data as verifiable Parquet"
license = "MIT"
homepage = "https://ods.fyi"
repository = "https://github.com/olizilla/ods"
readme = "README.md"
keywords = ["nhs", "org", "open-data", "oci", "parquet"]
categories = ["command-line-utilities", "science"]
exclude = ["worker"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
quick-xml = { version = "0.31", features = ["serialize"] }
arrow = { version = "53", default-features = false }
parquet = { version = "53", features = ["arrow"] }
walkdir = "2.4"
zip = "1.0"
rayon = "1.12"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
ureq = { version = "2.9", features = ["json"] }
crossterm = "0.29"
comfy-table = { version = "8.0", features = ["custom_styling"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.9"
jsonschema = "0.28"

[profile.release]
opt-level = 3
